<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Goose Bistro | Pizza-On-Demand</title>
  </head>
  <body>
    <h1>Black Goose Bistro | Pizza-On-Demand</h1>

    <!-- Mulai hanya SATU form -->
    <form action="thankyou.html" method="get">
      <fieldset>
        <legend>Your Information</legend>
        <label for="username">Name: </label>
        <input type="text" id="username" name="username" required /><br /><br />

        <label for="address">Address: </label>
        <input type="text" id="address" name="address" required /><br /><br />

        <label for="telephone-number">Telephone Number: </label>
        <input
          type="tel"
          id="telephone-number"
          name="telephone-number"
          required
        /><br /><br />

        <label for="email">Email: </label>
        <input type="email" id="email" name="email" required />
      </fieldset>

      <br />

      <fieldset>
        <legend>Delivery Instructions</legend>
        <textarea
          name="deskripsi"
          rows="5"
          cols="40"
          maxlength="400"
          placeholder="Description (Max 400 characters)"
          required
        ></textarea>
      </fieldset>

      <br />

      <fieldset>
        <legend>Design Your Dream Pizza</legend>

        <p><strong>Crust (Choose one)</strong></p>
        <input
          type="radio"
          id="classic-white"
          name="crust"
          value="Classic White"
          required
        />
        <label for="classic-white">Classic White</label><br />

        <input type="radio" id="multigrain" name="crust" value="Multigrain" />
        <label for="multigrain">Multigrain</label><br />

        <input
          type="radio"
          id="cheese-stuffed"
          name="crust"
          value="Cheese-Stuffed Crust"
        />
        <label for="cheese-stuffed">Cheese-Stuffed Crust</label><br />

        <input type="radio" id="gluten-free" name="crust" value="Gluten Free" />
        <label for="gluten-free">Gluten Free</label><br />

        <br />

        <p><strong>Toppings (Choose as many as you want)</strong></p>
        <input
          type="checkbox"
          id="red-sauce"
          name="toppings"
          value="Red Sauce"
        />
        <label for="red-sauce">Red Sauce</label><br />

        <input
          type="checkbox"
          id="white-sauce"
          name="toppings"
          value="White Sauce"
        />
        <label for="white-sauce">White Sauce</label><br />

        <input
          type="checkbox"
          id="mozarella"
          name="toppings"
          value="Mozarella Cheese"
        />
        <label for="mozarella">Mozarella Cheese</label><br />

        <input
          type="checkbox"
          id="pepperoni"
          name="toppings"
          value="Pepperoni"
        />
        <label for="pepperoni">Pepperoni</label><br />

        <input
          type="checkbox"
          id="mushrooms"
          name="toppings"
          value="Mushrooms"
        />
        <label for="mushrooms">Mushrooms</label><br />

        <input type="checkbox" id="peppers" name="toppings" value="Peppers" />
        <label for="peppers">Peppers</label><br />

        <input
          type="checkbox"
          id="anchovies"
          name="toppings"
          value="Anchovies"
        />
        <label for="anchovies">Anchovies</label><br />

        <br />

        <label for="jumlah">How many pizzas: </label>
        <input
          type="number"
          id="jumlah"
          name="jumlah"
          value="1"
          min="1"
          max="10"
          required
        />
      </fieldset>

      <br />

      <input type="submit" value="Bring me a pizza!" />
      <input type="reset" value="Reset" />
    </form>
    <!-- Akhir form -->
  </body>
</html>

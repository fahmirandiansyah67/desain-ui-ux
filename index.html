<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmayMart | Cart</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/feather-icons"></script>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <h1 class="logo">AmayMart</h1>
      <div class="links">
        <a href="#">Kategori 1</a>
        <a href="#">Kategori 2</a>
        <a href="#">Kategori 3</a>
      </div>
      <div class="icons">
        <i data-feather="search"></i>
        <i data-feather="shopping-cart"></i>
      </div>
    </nav>

    <!-- Cart Section -->
    <section class="cart">
      <div class="cart-table">
        <h2>Your Cart</h2>
        <table>
          <thead>
            <tr>
              <th>Deskripsi</th>
              <th>Harga</th>
              <th>Banyak Barang</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <div class="item">
                  <div class="image"></div>
                  <div>
                    <p>T-Shirt</p>
                    <small>Size: Small</small>
                  </div>
                </div>
              </td>
              <td>Rp20.000</td>
              <td><input type="number" min="1" value="1" /></td>
            </tr>
          </tbody>
        </table>
      </div>

      <aside class="summary">
        <h3>Summary (1 Item)</h3>
        <div><span>Subtotal</span><span>RP20.000</span></div>
        <div><span>Shipping</span><span>RP200</span></div>
        <div><span>Est. Taxes</span><span>RP140</span></div>
        <div class="total"><strong>Total</strong><strong>RP23.600</strong></div>
        <input type="submit" />
      </aside>
    </section>

    <script>
      feather.replace();
    </script>
  </body>
</html>

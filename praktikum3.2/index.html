<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <a href="#">Home</a>
      <a href="#">Generate Link</a>
      <a href="#">Transaction History</a>
      <a href="#">Policy</a>
      <a href="#">Logout</a>
    </header>

    <main>
      <section class="left">
        <div class="kotak"></div>
        <form>
          <input type="file" id="upload" name="upload" />
        </form>
      </section>

      <section class="right">
        <form action="hasil-form.html" method="get">
          <label for="title">Title Here :</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="MacBook Air £800"
            required
          />

          <br /><label for="description">Description :</label>
          <textarea
            id="description"
            name="description"
            rows="4"
            placeholder="Year: 2009&#10;Model:&#10;Condition: Mint"
          ></textarea>

          <br /><label for="account-number">Account Number :</label>
          <input
            type="text"
            id="account-number"
            name="accountNumber"
            placeholder="123-456-789-0"
            required
          />

          <br /><label for="bank">Bank :</label>
          <select id="bank" name="bank" required>
            <option value="">Select Bank</option>
            <option value="HSBC">HSBC</option>
            <option value="BCA">BCA</option>
            <option value="Mandiri">Mandiri</option>
            <option value="BRI">BRI</option>
          </select>

          <br /><label for="account-holder">Account Holder :</label>
          <input
            type="text"
            id="account-holder"
            name="accountHolder"
            placeholder="Name Here"
            required
          />

          <br /><label for="transaction">Transaction :</label>
          <input
            type="number"
            id="transaction"
            name="transaction"
            min="1"
            max="10"
            value="1"
            required
          />
          <p class="note">
            * If the transaction is for 3 persons, choose 3 from the drop-down.
          </p>

          <div class="checkbox-group">
            <input type="checkbox" id="send-phone" name="sendPhone" />
            <label for="send-phone">Send to Mobile Phone</label><br />
            <input type="checkbox" id="send-email" name="sendEmail" />
            <label for="send-email">Send to Email</label>
          </div>

          <label for="mobile">Send to Mobile Phone :</label>
          <input
            type="text"
            id="mobile"
            name="mobile"
            placeholder="1234567890, 1234567891"
          />

          <br /><label for="email">Send to Email :</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
          />

          <br />
          <button type="submit" class="submit-btn">Generate Nabr Link</button>
        </form>
      </section>
    </main>
  </body>
</html>
